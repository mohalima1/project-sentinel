name: Project Sentinel CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  development-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.11.24
      - name: Development setup
        run: .\scripts\setup.cmd
      - name: Backend tests and lint
        run: |
          uv run --locked pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check backend migrations tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff format --check backend migrations tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked alembic check
          exit $LASTEXITCODE
      - name: Frontend dependency audit
        run: npm.cmd --prefix frontend audit
      - name: Chromium synthetic fixture checks
        run: |
          uv run --locked playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python tests/browser_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python tests/local_browser_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python tests/concurrent_login_check.py
          exit $LASTEXITCODE
